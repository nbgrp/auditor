version: 2
updates:
  - package-ecosystem: "composer"
    directories:
      - "/tools/phan"
      - "/tools/php-cs-fixer"
      - "/tools/phpcs"
      - "/tools/phpmd"
      - "/tools/phpmnd"
      - "/tools/phpstan"
      - "/tools/psalm"
    schedule:
      interval: "daily"
    versioning-strategy: "increase-if-necessary"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
